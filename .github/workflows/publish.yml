name: publish

# **Ships a tagged version to CPAN.** Started by `tagpr.yml` with `workflow_dispatch` on the tag it
# made (a tag pushed with GITHUB_TOKEN does not start `push: tags`). `push: tags` is for a tag
# pushed by hand. Keep this file's name and `name`: `release-workflow` of `tagpr.yml` starts it.
#
# The jobs are the shared workflow of kan/tagpr-scripts (`scripts/tagpr/.github/workflows/publish-cpan.yml`
# is a copy of it). What they check, what each job may do, and what to do when one fails are in
# `scripts/tagpr/README.md` ("The CPAN publish workflow").
#
# **An upload cannot be taken back.** PAUSE never takes the same file name twice, so a version that
# went out broken needs a new version.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# **One run per tag, never cancelled.** A run stopped after the upload leaves a version on CPAN
# with no GitHub release. The shared workflow has no `concurrency` of its own, so the two do not
# deadlock.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    # **The same tagpr-scripts commit as `tagpr.yml`, `tagpr-label.yml` and `scripts/tagpr/`.**
    # `verify-subtree.mjs` in test.yml checks this line too.
    uses: kan/tagpr-scripts/.github/workflows/publish-cpan.yml@f95892b128286dd1f84eea57f1e08a17e1f26eb3
    permissions:
      contents: write  # read the repository, create the release
    # The PAUSE credentials (`PAUSE_USER` / `PAUSE_PASSWORD`) are in the `cpan` environment of this
    # repository. The shared workflow reads only those two, in its `upload` job; the Mailgun secrets
    # reach no step, so the tests that call the real API skip there (test.yml runs them).
    secrets: inherit
    with:
      # Build.PL of module_maker = "ModuleBuildTiny" (minil.toml); cpanfile has no configure phase
      cpanm-modules: Module::Build::Tiny
      # The Perl of the `test` job of test.yml (perl:5.44). Move it with the Dockerfile (CLAUDE.md)
      perl-version: '5.44'
      # `test` is left out: the default `prove -lr t` is what this repository runs
