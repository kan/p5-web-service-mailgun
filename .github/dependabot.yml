version: 2
updates:
  # Updates the actions of .github/workflows. Dependabot has no ecosystem for cpanfile, so the
  # Perl dependencies are not covered here.
  #
  # cooldown: only take a version 3 days after it is published. A broken or hijacked release is
  # usually pulled within a few days. Security updates are not delayed by it.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns:
          - "*"
