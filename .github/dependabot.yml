version: 2
updates:
  # Updates the actions of .github/workflows. Dependabot has no ecosystem for cpanfile, so the
  # Perl dependencies are not covered here.
  #
  # cooldown: only take a version 3 days after it is published. A broken or hijacked release is
  # usually pulled within a few days. Security updates are not delayed by it.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns:
          - "*"
    ignore:
      # Moved together with scripts/tagpr/ by git subtree pull, never on its own
      - dependency-name: 'kan/tagpr-scripts*'

  # Updates the base image of the development container (Dockerfile, `FROM perl:5.42`).
  #
  # **Only the Dockerfile is updated.** Dependabot does not read the `container:` images of
  # .github/workflows, so a pull request that moves the Perl version (5.42 to 5.44, say) must also
  # move, by hand: the `perl:<version>` images of test.yml, the `perl-version` of publish.yml, and
  # the volume name in docker-compose.yml (CLAUDE.md).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
